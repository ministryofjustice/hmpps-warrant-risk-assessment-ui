generic-service:
  nameOverride: hmpps-warrant-risk-assessment-ui
  productId: 'HMPPS501' # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  serviceAccountName: "hmpps-warrant-risk-assessment"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-warrant-risk-assessment-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-warrant-risk-assessment-ui-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    REDIS_ENABLED: 'true'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    AUDIT_SQS_REGION: 'eu-west-2'
    AUDIT_SERVICE_NAME: 'HMPPS501' # Your audit service name

  namespace_secrets:
    # These secrets are created by terraform.
    hmpps-warrant-risk-assessment-ui-client-creds:
      CLIENT_CREDS_CLIENT_ID: 'CLIENT_CREDS_CLIENT_ID'
      CLIENT_CREDS_CLIENT_SECRET: 'CLIENT_CREDS_CLIENT_SECRET'
    hmpps-warrant-risk-assessment-ui-auth-code:
      AUTH_CODE_CLIENT_ID: 'AUTH_CODE_CLIENT_ID'
      AUTH_CODE_CLIENT_SECRET: 'AUTH_CODE_CLIENT_SECRET'
    hmpps-warrant-risk-assessment-ui-session-secret:
      SESSION_SECRET: 'SESSION_SECRET'
    hmpps-warrant-risk-assessment-ui-elasticache-redis:
      REDIS_HOST: 'primary_endpoint_address'
      REDIS_AUTH_TOKEN: 'auth_token'
    hmpps-warrant-risk-assessment-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    os-datahub:
      OS_DATAHUB_API_KEY: "OS_DATAHUB_API_KEY"
    hmpps-audit:
      AUDIT_SQS_QUEUE_URL: 'sqs_queue_url'
      AUDIT_SQS_QUEUE_NAME: 'sqs_queue_name'
    hmpps-domain-events:
      HMPPS_DOMAIN_EVENTS_TOPIC_ARN: 'topic_arn'

  allowlist:
    groups:
      - internal
      - unilink_staff

generic-prometheus-alerts:
  targetApplication: hmpps-warrant-risk-assessment-ui
